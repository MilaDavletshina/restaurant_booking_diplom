{% extends 'reservations/home.html' %}

{% block content %}
<div class="col-6">
    <h4>Бронирование стола</h4>

    <div class="card-body">
        {% csrf_token %}
        {{ form.as_table }}
    </div>

    <p></p>

    <div class="row mb-2">
        <div class="col-md-12">
            <p class="lead d-flex justify-content-center">
                <button type="submit" class="btn btn-light me-2">
                    {% if object %}
                    Сохранить
                    {% else %}
                    Создать
                    {% endif %}
                </button>

                {% if user.is_authenticated %}
                <a class="btn btn-light" href="{% url 'reservations:personal_account' %}" role="button">Назад</a>
                {% else %}
                <a class="btn btn-light" href="{% url 'reservations:reservation_list' %}" role="button">Назад</a>
                {% endif %}
            </p>
        </div>
    </div>
</div>

{% endblock %}
